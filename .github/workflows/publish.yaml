# Publish to crates.io via Trusted Publishing (OIDC): no long-lived token.
#
# Triggered by pushing a `v*` tag, which `nix run .#release -- <version>`
# creates after bumping the version, verifying the Nix build and tests, and
# a `cargo publish --dry-run`.  The checks (`nix build .#all`, everything
# `nix flake check` covers) run on the Trustless builder like the check
# workflow; only the token exchange and the upload happen on the GitHub
# runner, where the OIDC identity is.  rust-lang/crates-io-auth-action
# exchanges GitHub's identity token for a short-lived crates.io token and
# revokes it when the job ends.
#
# One-time setup on crates.io (Settings -> Trusted Publishing of the crate,
# possible only after the first, manual publish):
#   repository owner: j-baker, repository name: sequence-heap,
#   workflow filename: publish.yaml, environment: release.
# And on GitHub: an environment named `release` (Settings -> Environments),
# optionally with required reviewers for a manual gate.
name: Publish to crates.io
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    name: Publish
    runs-on: trustless-amd64-large
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          }
      - name: Build and test (all checks)
        uses: j-baker/build-action@v0.4.0
        with:
          ssh-host: dev.trustless.build
          org-slug: local-test
          versioned-packages: all
          github-token: ${{ secrets.ACTION_PAT }}
          command: nix build .#all
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: nix develop --command cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
